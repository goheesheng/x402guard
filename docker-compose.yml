version: "3.8"

services:
  x402guard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time arg for Next.js (baked into the build)
        NEXT_PUBLIC_API_URL: https://x402guard.xyz
    ports:
      - "3000:3000"
    env_file:
      # Load server credentials from server/.env
      - ./server/.env
    environment:
      # Override for production
      - NODE_ENV=production
    volumes:
      # Persist logs
      - x402guard-logs:/var/log/x402guard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  x402guard-logs:
